<meta charset="utf-8">
<script src="https://unpkg.com/vue@3"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<div id="app" class="container py-4" v-bind:class="modoEscuro ? 'bg-dark' : 'bg-light'">
  <div class="card" v-bind:class="modoEscuro ? 'bg-dark text-white' : 'bg-white text-dark'">
    <div class="card-body">
      <h4>Tarefas</h4>
      <div class="form-check form-switch mb-3">
        <input type="checkbox" class="form-check-input" v-model="modoEscuro">
        <label class="form-check-label">modo escuro</label>
      </div>
      <div class="input-group mb-3">
        <input type="text" class="form-control" v-model="novaTarefa" placeholder="Nova tarefa">
        <button class="btn btn-primary" v-on:click="adicionarTarefa()">
          adicionar
        </button>
      </div>
      <input type="search" class="form-control mb-3" v-model="busca" placeholder="Buscar tarefa">
      <div class="alert alert-warning" v-if="busca.trim() && tarefasFiltradas.length === 0">
        Nenhuma tarefa encontrada para "{{ busca }}".
      </div>
      <h6>Pendentes</h6>
      <ul class="list-group mb-3">
        <template v-for="tarefa in tarefasFiltradas" v-bind:key="tarefa.id">
          <li class="list-group-item" v-if="!tarefa.concluida"
            v-bind:class="modoEscuro ? 'bg-dark text-white border-light' : ''">
            <input type="checkbox" v-model="tarefa.concluida">
            {{ tarefa.texto }}
            <button class="btn btn-sm btn-danger ms-2" v-on:click="excluirTarefa(tarefa.id)">excluir</button>
          </li>
        </template>
      </ul>
      <h6>Concluídas</h6>
      <ul class="list-group">
        <template v-for="tarefa in tarefasFiltradas" v-bind:key="tarefa.id">
          <li class="list-group-item" v-if="tarefa.concluida"
            v-bind:class="modoEscuro ? 'bg-dark text-white border-light' : ''">
            <input type="checkbox" v-model="tarefa.concluida">
            {{ tarefa.texto }}
          </li>
        </template>
      </ul>
    </div>
  </div>
</div>
<script>
  Vue.createApp({
    data() {
      return {
        modoEscuro: false,
        novaTarefa: '',
        busca: '',
        proximoId: 3,
        tarefas: [
          { id: 1, texto: 'Estudar', concluida: false },
          { id: 2, texto: 'Ler capítulo', concluida: true }
        ]
      }
    },
    computed: {
      tarefasFiltradas() {
        const termo = this.busca.trim().toLowerCase()
        return this.tarefas.filter(tarefa => tarefa.texto.toLowerCase().includes(termo))
      }
    },
    methods: {
      adicionarTarefa() {
        if (this.novaTarefa.trim()) {
          this.tarefas.push({ id: this.proximoId, texto: this.novaTarefa, concluida: false })
          this.proximoId++
          this.novaTarefa = ''
        }
      },
      excluirTarefa(id) {
        const indice = this.tarefas.findIndex(tarefa => tarefa.id === id)
        this.tarefas.splice(indice, 1)
      }
    }
  }).mount('#app')
</script>
